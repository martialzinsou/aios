description "aiOS agentic on-device assistant"
author "aiOS Project"

# Fail-closed by default.  The agent can read; anything that mutates state,
# executes a command or talks to the network is refused until a session helper
# provides a human-in-the-loop Confirmer.
start on started boot-services
stop on stopping boot-services

respawn
respawn limit 5 10

kill timeout 10

pre-start script
    mkdir -p -m 0700 /run/aios
    mkdir -p -m 0700 /var/lib/aios
    chown root:root /run/aios /var/lib/aios
end script

script
    export AIOS_STATE_DIR=/var/lib/aios
    export AIOS_JAIL=/home

    exec /usr/bin/aios serve \
        --socket /run/aios/agent.sock \
        --no-confirm \
        --jail /home \
        --policy /usr/share/aios/aios-policy.json \
        --audit /var/lib/aios/audit.jsonl \
        --brain auto
end script
