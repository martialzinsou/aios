[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-agent"
version = "0.1.0"
description = "aiOS — agentic on-device AI layer for a Chromium OS based operating system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "aiOS" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=9.0"]

[project.scripts]
aios = "aios_agent.cli:main"
aios-request = "aios_agent.request:main"

[tool.setuptools.packages.find]
where = ["agent/src"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.9"
mypy_path = "agent/src"
packages = ["aios_agent"]
ignore_missing_imports = true
